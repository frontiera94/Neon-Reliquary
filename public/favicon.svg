<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#181b30" />
      <stop offset="55%" stop-color="#0f111c" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </radialGradient>

    <!-- Neon Cyan Glow -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Magenta Accent Glow -->
    <filter id="magenta-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="cyan-linear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0099ff" />
    </linearGradient>

    <linearGradient id="magenta-linear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff47c5" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="facet-fill-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#005260" stop-opacity="0.04" />
    </linearGradient>

    <linearGradient id="facet-fill-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#701a75" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="facet-fill-3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Base Plate (Square with smooth rounded corners) -->
  <rect width="512" height="512" rx="108" fill="url(#bg-grad)" />
  <rect width="510" height="510" x="1" y="1" rx="107" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />

  <!-- Ambient background glow orbs -->
  <circle cx="160" cy="170" r="120" fill="#00f0ff" opacity="0.12" filter="url(#cyan-glow)" />
  <circle cx="360" cy="350" r="110" fill="#d946ef" opacity="0.10" filter="url(#magenta-glow)" />

  <!-- Geometric Tactical D20 / Relic Matrix -->
  <!-- Outer Hexagonal Silhouette Vertices:
       Top: (256, 76)
       Top-Right: (412, 166)
       Bottom-Right: (412, 346)
       Bottom: (256, 436)
       Bottom-Left: (100, 346)
       Top-Left: (100, 166)
  -->

  <!-- Inner Inverted Triangle Vertices (Front Face):
       Inner-Top-Left: (180, 216)
       Inner-Top-Right: (332, 216)
       Inner-Bottom: (256, 348)
  -->

  <!-- Facet Polygons -->
  <!-- Central Triangle Face -->
  <polygon points="180,216 332,216 256,348" fill="url(#facet-fill-3)" stroke="#00f0ff" stroke-width="2.5" />

  <!-- Top-Center Triangle -->
  <polygon points="256,76 180,216 332,216" fill="url(#facet-fill-1)" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.7" />

  <!-- Top-Left Triangle -->
  <polygon points="256,76 100,166 180,216" fill="url(#facet-fill-2)" stroke="#d946ef" stroke-width="2" stroke-opacity="0.8" />

  <!-- Top-Right Triangle -->
  <polygon points="256,76 412,166 332,216" fill="url(#facet-fill-1)" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.7" />

  <!-- Mid-Left Triangle -->
  <polygon points="100,166 180,216 100,346" fill="url(#facet-fill-1)" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.7" />

  <!-- Mid-Right Triangle -->
  <polygon points="412,166 332,216 412,346" fill="url(#facet-fill-2)" stroke="#d946ef" stroke-width="2" stroke-opacity="0.8" />

  <!-- Lower-Left Triangle -->
  <polygon points="100,346 180,216 256,348" fill="url(#facet-fill-2)" stroke="#d946ef" stroke-width="2" stroke-opacity="0.8" />

  <!-- Lower-Right Triangle -->
  <polygon points="412,346 332,216 256,348" fill="url(#facet-fill-1)" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.7" />

  <!-- Bottom-Left to Bottom Triangle -->
  <polygon points="100,346 256,348 256,436" fill="url(#facet-fill-1)" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.7" />

  <!-- Bottom-Right to Bottom Triangle -->
  <polygon points="412,346 256,348 256,436" fill="url(#facet-fill-2)" stroke="#d946ef" stroke-width="2" stroke-opacity="0.8" />

  <!-- Outer Hexagon Frame with Glow -->
  <polygon points="256,76 412,166 412,346 256,436 100,346 100,166"
           fill="none" stroke="url(#cyan-linear)" stroke-width="5" stroke-linejoin="round"
           filter="url(#cyan-glow)" />
  <polygon points="256,76 412,166 412,346 256,436 100,346 100,166"
           fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />

  <!-- Core Arcane Sigil in Central Face: Neon 20 -->
  <g transform="translate(256, 266)">
    <!-- Arcane core circle -->
    <circle cx="0" cy="0" r="28" fill="#07070d" stroke="url(#magenta-linear)" stroke-width="2" filter="url(#magenta-glow)" />
    <!-- Stylized '20' or Relic Core Icon -->
    <text x="0" y="7" font-family="'Space Grotesk', 'JetBrains Mono', monospace" font-size="20" font-weight="900" fill="#00f0ff" text-anchor="middle" letter-spacing="1">
      20
    </text>
  </g>

  <!-- Glowing Vertex Nodes -->
  <circle cx="256" cy="76" r="4.5" fill="#ffffff" filter="url(#cyan-glow)" />
  <circle cx="412" cy="166" r="4.5" fill="#00f0ff" filter="url(#cyan-glow)" />
  <circle cx="412" cy="346" r="4.5" fill="#d946ef" filter="url(#magenta-glow)" />
  <circle cx="256" cy="436" r="4.5" fill="#00f0ff" filter="url(#cyan-glow)" />
  <circle cx="100" cy="346" r="4.5" fill="#d946ef" filter="url(#magenta-glow)" />
  <circle cx="100" cy="166" r="4.5" fill="#00f0ff" filter="url(#cyan-glow)" />

  <circle cx="180" cy="216" r="3.5" fill="#ffffff" />
  <circle cx="332" cy="216" r="3.5" fill="#ffffff" />
  <circle cx="256" cy="348" r="3.5" fill="#00f0ff" />
</svg>
